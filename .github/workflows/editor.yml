name: Standalone editor checks
# Manual only. Standard GitHub-hosted runners; no artifact uploads.
# Review Actions usage/billing before dispatching (especially for private repos).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Ubuntu build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxss-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Configure headless
        run: cmake --preset dev
      - name: Build headless
        run: cmake --build --preset dev --parallel 2
      - name: Test headless
        run: ctest --preset dev
      - name: Configure desktop
        run: cmake --preset desktop
      - name: Build desktop
        run: cmake --build --preset desktop --parallel 2
      - name: Test desktop
        run: ctest --preset desktop

  sanitizers-and-tidy:
    name: Linux sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang-tidy
      - name: Configure address/undefined sanitizers
        run: cmake --preset sanitizers -DLYKO_CLANG_TIDY=ON
      - name: Build address/undefined sanitizers
        run: cmake --build --preset sanitizers --parallel 2
      - name: Test address/undefined sanitizers
        run: ctest --preset sanitizers
      - name: Configure thread sanitizer
        run: cmake --preset thread-sanitizer
      - name: Build thread sanitizer
        run: cmake --build --preset thread-sanitizer --target lyko_queue_tests lyko_tests --parallel 2
      - name: Test thread sanitizer
        run: ctest --preset thread-sanitizer -R "desktop_command_queue|command_bus"
